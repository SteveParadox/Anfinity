name: anfinity-production

x-backend-common: &backend-common
  image: ${ANFINITY_BACKEND_IMAGE:-anfinity-api:latest}
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env.production
  environment:
    ENVIRONMENT: production
    DEBUG: "false"
    PORT: "8000"
    CELERY_WORKER_POOL: ${CELERY_WORKER_POOL:-prefork}
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  api:
    <<: *backend-common
    command: >
      sh -c "uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --proxy-headers
      --forwarded-allow-ips='*'"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.getenv('PORT', '8000'), timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 60s

  worker:
    <<: *backend-common
    command: >
      sh -c "python -m celery -A app.celery_app:celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=celery,default,processing,enrichment,connectors,maintenance"
    stop_grace_period: 120s

  beat:
    <<: *backend-common
    command: >
      sh -c "python -m celery -A app.celery_app:celery_app beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule"
    stop_grace_period: 60s
