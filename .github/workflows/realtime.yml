name: Realtime validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run realtime:typecheck
      - run: npm run realtime:lint
      - run: npm run test:unit
      - run: npm run test:realtime
      - run: npm run build
      - run: npm run realtime:check -- --env staging
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Server/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_realtime_tickets.py tests/test_thinking_synthesis_task.py tests/test_thinking_sessions_service.py tests/test_notes_api_helpers.py tests/test_note_comments_service.py tests/test_auth_google_oauth.py tests/test_automation_registry_codegen.py -q
